<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-App Web Interface Diagnostic</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px 16px;
            background-color: #0f1416;
            color: #e1e8ed;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #1a2226;
            border: 1px solid #2a373e;
            border-radius: 8px;
            padding: 24px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        h2 {
            color: #00A651;
            margin-top: 0;
            font-size: 20px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #94a3b8;
        }
        .status-box {
            padding: 14px;
            border-radius: 6px;
            margin: 18px 0;
            font-weight: 600;
            font-size: 14px;
        }
        .present {
            background-color: #0d3820;
            color: #4ade80;
            border: 1px solid #166534;
        }
        .not-present {
            background-color: #3b1115;
            color: #f87171;
            border: 1px solid #7f1d1d;
        }
        .info-row {
            margin: 8px 0;
            font-size: 13px;
        }
        .info-label {
            color: #64748b;
        }
        .info-val {
            color: #38bdf8;
            font-family: monospace;
            word-break: break-all;
        }
        button {
            background-color: #2b3940;
            color: #d0dbe1;
            border: 1px solid #384952;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            margin-top: 14px;
            font-weight: 500;
        }
        button:hover {
            background-color: #384952;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Web Interface Diagnostic</h2>
        <p>This page verifies whether the application's native JavaScript interface is attached to the browser environment.</p>

        <div id="status-display" class="status-box not-present">
            Evaluating runtime environment...
        </div>

        <div class="info-row">
            <span class="info-label">Active Hostname:</span><br>
            <span class="info-val" id="host-name"></span>
        </div>

        <div class="info-row" style="margin-top: 12px;">
            <span class="info-label">Interface Object:</span><br>
            <span class="info-val" id="interface-status">checking...</span>
        </div>

        <button onclick="window.location.reload()">Reload Page</button>
    </div>

    <script>
        document.getElementById("host-name").innerText = window.location.hostname;
        const statusBox = document.getElementById("status-display");
        const interfaceStatus = document.getElementById("interface-status");

        window.addEventListener("load", function() {
            if (window.consumerapp && typeof window.consumerapp.evaluate === "function") {
                statusBox.className = "status-box present";
                statusBox.innerText = "✓ Native Interface (window.consumerapp) Detected";
                interfaceStatus.innerText = "Bound (function evaluate available)";
            } else {
                statusBox.className = "status-box not-present";
                statusBox.innerText = "✗ Native Interface Not Found";
                interfaceStatus.innerText = "Undefined";
            }
        });
    </script>
</body>
</html>
